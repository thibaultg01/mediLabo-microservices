services:
  notes-mongo:
    image: mongo:7
    container_name: notes-mongo
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: notesdb
    volumes:
      - notes-mongo-data:/data/db
      - ./docker/mongo-notes-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./docker/otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8889:8889"   # Metrics for Prometheus

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: always
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - otel-collector

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

  notes-service:
    image: thibaultg01/notes-service:latest
    build:
      context: ./notes-service
      dockerfile: Dockerfile
    container_name: notes-service
    restart: always
    depends_on:
      notes-mongo:
        condition: service_healthy
      otel-collector:
        condition: service_started
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://notes-mongo:27017/notesdb

      OTEL_SERVICE_NAME: notes-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: "none"
    ports:
      - "8082:8082"

  mysql:
    image: mysql:8
    container_name: mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: patientsdb
      MYSQL_USER: app
      MYSQL_PASSWORD: app
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  patient-service:
    image: thibaultg01/patient-service:latest
    build:
      context: ./patient-service
    container_name: patient-service
    restart: always
    depends_on:
      - mysql
      - otel-collector
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://mysql:3306/patientsdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: app
      DB_PASSWORD: app
      BASIC_USER: user
      BASIC_PASS: password

      OTEL_SERVICE_NAME: patient-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: "none"
    ports:
      - "8081:8081"

  assessment-service:
    image: thibaultg01/assessment-service:latest
    build:
      context: ./assessment-service
    container_name: assessment-service
    restart: always
    depends_on:
      - patient-service
      - notes-service
      - otel-collector
      - nlp-service
    environment:
      NLP_URL: http://nlp-service:8000
      PATIENTS_URL: http://gateway-service:8080/api/patients
      NOTES_URL: http://gateway-service:8080/api/notes
      BASIC_USER: user
      BASIC_PASS: password

      OTEL_SERVICE_NAME: assessment-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: "none"
    ports:
      - "8083:8083"

  gateway-service:
    image: thibaultg01/gateway-service:latest
    build:
      context: ./gateway-service
    container_name: gateway-service
    restart: always
    depends_on:
      - patient-service
      - notes-service
      - assessment-service
      - otel-collector
    environment:
      PATIENT_SERVICE_URL: http://patient-service:8081
      NOTES_SERVICE_URL: http://notes-service:8082
      ASSESSMENT_SERVICE_URL: http://assessment-service:8083
      BASIC_USER: user
      BASIC_PASS: password

      OTEL_SERVICE_NAME: gateway-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: "none"
    ports:
      - "8080:8080"

  front-app:
    image: thibaultg01/front-app:latest
    build:
      context: ./front-app
      dockerfile: Dockerfile
    container_name: front-app
    restart: always
    depends_on:
      - gateway-service
    ports:
      - "4200:80"

  nlp-service:
    build:
      context: ./nlp-service
      dockerfile: Dockerfile
    container_name: nlp-service
    restart: always
    depends_on:
      - otel-collector
    environment:
      OTEL_SERVICE_NAME: nlp-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: "none"
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=medilabo,service.version=1.0.0
    ports:
      - "8000:8000"

  mongodb-exporter:
    image: percona/mongodb_exporter:0.40.0
    container_name: mongodb-exporter
    restart: always
    command:
      - --mongodb.uri=mongodb://notes-mongo:27017
    ports:
      - "9216:9216"
    depends_on:
      notes-mongo:
        condition: service_healthy

volumes:
  notes-mongo-data:
  mysql-data:
  grafana_data:
