name: CI-CD MediLabo

on:
  push:
    branches: ["dev"]
  pull_request:
    branches: ["dev"]

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - patient-service
          - notes-service
          - assessment-service
          - gateway-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Run Maven tests
        run: mvn -B -f ${{ matrix.service }}/pom.xml test

  frontend-build:
    runs-on: ubuntu-latest
    needs: backend-tests

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: front-app/package-lock.json

      - name: Install deps
        run: |
          cd front-app
          npm ci

      - name: Build front
        run: |
          cd front-app
          npm run build --if-present

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build images with docker-compose
        run: docker compose build
