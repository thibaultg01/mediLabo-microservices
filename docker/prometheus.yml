global:
  scrape_interval: 5s

scrape_configs:
  - job_name: "otel-collector"
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: "notes-service"
    metrics_path: "/actuator/prometheus"
    basic_auth:
      username: "user"
      password: "password"
    static_configs:
      - targets: ["notes-service:8082"]

  - job_name: "patient-service"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["patient-service:8081"]

  - job_name: "assessment-service"
    metrics_path: "/actuator/prometheus"
    basic_auth:
      username: "user"
      password: "password"
    static_configs:
      - targets: ["assessment-service:8083"]

  - job_name: "gateway-service"
    metrics_path: "/actuator/prometheus"
    basic_auth:
      username: "user"
      password: "password"
    static_configs:
      - targets: ["gateway-service:8080"]

  - job_name: "nlp-service"
    metrics_path: /metrics
    static_configs:
      - targets: ["nlp-service:8000"]

  - job_name: "mongodb"
    static_configs:
      - targets: ["mongodb-exporter:9216"]
